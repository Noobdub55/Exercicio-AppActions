name: Testes AppActions + Relatório

on:
  push:
    branches:
      - main
      - exercicios-AppActions-Intercept

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Rodar Cypress
        uses: cypress-io/github-action@v6
        with:
          build: npm install
          wait-on: 'http://lojaebac.ebaconline.art.br'
        continue-on-error: true

      - name: Garantir relatório
        run: |
          mkdir -p reports

          if [ -f "./reports/mochawesome.html" ]; then
            sed -i 's|/assets|assets|g' ./reports/mochawesome.html
            cp ./reports/mochawesome.html ./reports/index.html
          else
            echo "<h1>Relatório não gerado</h1>" > ./reports/index.html
          fi

          touch ./reports/.nojekyll
          ls -la ./reports

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./reports/

  deploy:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4